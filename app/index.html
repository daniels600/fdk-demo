<!DOCTYPE html>

<html lang="en">
  <head>
    <title>AV Database Lookup</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="{{{appclient}}}"></script>
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
  </head>

  <body>
    <div class="main">
      <p>AV Database Lookup</p>
      <p id="apptext"></p>
      <div class="button-container">
        <fw-input id="eurocodeInput" placeholder="Enter Eurocode" style="width: 100%;"></fw-input>
        <fw-button id="lookupEurocodeBtn" color="primary" style="margin-top: 10px;">Lookup Eurocode</fw-button>
        <fw-button id="closeTicketBtn" color="danger" style="margin-top: 10px;">Close Ticket</fw-button>
        <p id="statusMessage"></p>
        <div id="infoDisplay" style="margin-top: 15px; text-align: left; font-size: 12px;"></div>
      </div>
    </div>
  </body>

  <script defer src="scripts/app.js"></script>
  <script async type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
  <script async nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>
</html>
