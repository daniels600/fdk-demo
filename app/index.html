<!DOCTYPE html>

<html lang="en">
  <head>
    <title>AV Database Lookup</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="{{{appclient}}}"></script>
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
  </head>

  <body>
    <div class="main">
      <div class="header">
        <h1>AV Database Lookup</h1>
        <p id="apptext"></p>
      </div>

      <div class="controls">
        <fw-input id="oemInput" placeholder="Enter OEM Code"></fw-input>
        <div class="button-row">
          <fw-button id="lookupOEMBtn" color="primary">Lookup</fw-button>
          <fw-button id="closeTicketBtn" color="danger">Close Ticket</fw-button>
        </div>
        <p id="statusMessage"></p>
      </div>

      <div class="info-container">
        <div class="info-header">Results</div>
        <div id="infoDisplay"></div>
      </div>
    </div>
  </body>

  <script defer src="scripts/app.js"></script>
  <script async type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
  <script async nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>
</html>
